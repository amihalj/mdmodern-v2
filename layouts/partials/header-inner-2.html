<header class="tc-header-style2 top-header {{ if .header_image }} with-image {{ end }}">
    <div class="container">
        <div class="top-info">
            {{ with .tags }}
            <div class="tags mb-50">
                {{ range . }}
                <a href="#"> {{ . }} </a>
                {{ end }}
            </div>
            {{ end  }}
            <h1 class="title">{{ .h1 | markdownify  }}</h1>
            {{ with .intro }}
            <div class="text fsz-18 color-666 text-center"> {{ . | markdownify }} </div>
            {{ end }}
        </div>
    </div>
    {{ if .header_image }}
        <img src="{{ .header_image }}" alt="{{ .h1  }}" class="bg img-cover" data-speed="1.25">
    {{ end }}
    
</header>
