<div class="rotate-box" data-speed="1" data-lag="0.4">
    <a href="#" class="rotate-circle fsz-35 rotate-text d-inline-block text-uppercase">
        <svg class="textcircle" viewBox="0 0 500 500">
            <defs>
                <path id="textcircle"
                    d="M250,400 a150,150 0 0,1 0,-300a150,150 0 0,1 0,300Z">
                </path>
            </defs>
            <text>
                <textPath xlink:href="#textcircle" textLength="900">{{ .text }} </textPath>
            </text>
        </svg>
    </a>
    {{ with .number }}
    <span class="num"> {{ . }} </span>
    {{ end }}
    {{ with .image }}
    <img src="{{ .src }}" alt="{{ .alt }}" class="icon">
    {{ end }}
    
</div>
