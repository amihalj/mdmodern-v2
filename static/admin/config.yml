  - name: "rest"
    label: "Ostale stranice"
    delete: false # Prevent users from deleting documents in this collection
    editor:
      preview: false
    files:
      - name: "home"
        label: "Home"
        file: "content/_index.md"
        description: "Home page"
        fields:
          - label: Meta
            name: meta
            widget: "object"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Keywords", name: keywords, widget: string, required: false }
              - { label: "Description", name: description, widget: string, required: false }
              - { label: "Headline", name: headline, widget: string, required: false }
          - { label: "Heading", name: "h1", widget: "string" }

          - label: About us
            name: about_us
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: content, widget: markdown, required: false }
              - label: Boxes
                name: boxes
                widget: object
                required: true
                fields:
                - label: Left box
                  name: left
                  widget: object
                  required: true
                  fields:
                  - { label: "Title", name: title, widget: string, required: false }
                  - { label: "Logo", name: logo, widget: string, required: false }
                - label: Middle box
                  name: middle
                  widget: object
                  required: true
                  fields:
                  - { label: "Title", name: title, widget: string, required: false }
                  - { label: "Logo", name: logo, widget: string, required: false }
