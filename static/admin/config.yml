                - { label: "Tags", name: tags, widget: string, required: false }
                - { label: "Text", name: content, widget: markdown, required: false }
                - label: Project image
                  name: img
                  widget: object
                  fields:
                    - { label: "Image link", name: src, widget: string }
                    - { label: "Alt", name: alt, widget: string, required: false }

          - label: Services
            name: services
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: content, widget: markdown, required: false }
              - label: List of services
                name: list
                widget: list
                required: true
                fields:
                - { label: "Title", name: title, widget: string, required: false }
                - { label: "Image", name: logo, widget: string, required: false }
                - { label: "Intro", name: intro, widget: string, required: false }
                - { label: "Text", name: content, widget: markdown, required: false }

          - label: Partners
            name: partners
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: content, widget: markdown, required: false }
