backend:
  name: github
  repo: superpheebs/MD-Modern
  branch: main

site_url: https://modern-engineering-web.netlify.app

publish_mode: editorial_workflow
media_folder: static/img/assets
public_folder: /img/assets

slug:
  encoding: "ascii"
  clean_accents: true

collections: # A list of collections the CMS should be able to edit
  - name: projects # Used in routes, ie.: /admin/collections/:slug/edit
    label: "Projects" # Used in the UI
    label_singular: "Project" # Used in the UI, ie: "New Post"
    description: >
      Projects pages
    folder: "content/projects"
    slug: "{{slug}}"
    create: true # Allow users to create new documents in this collection
    sortable_fields: ['title', 'date', 'listed_intro.order']
    view_filters:
      - label: Posts With Index
        field: title
        pattern: "This is post #"
      - label: Posts Without Index
        field: title
        pattern: front matter post
      - label: Drafts
        field: draft
        pattern: true

    fields: # The fields each document in this collection have
      - { label: "Title", name: "title", widget: "string", tagname: "h1" }
      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
          format: "YYYY-MM-DD HH:mm",
        }
      - { label: "Type", name: "type", widget: "hidden", default: "procedures" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - {
        label: Meta,
        name: meta,
        widget: "object",
        fields: [
          { label: "Title", name: title, widget: string, },
          { label: "Keywords", name: keywords, widget: string, required: false },
          { label: "Description", name: description, widget: string, required: false },
          { label: "Headline", name: headline, widget: string, required: false }
          ]
        }
        
      - label: List view
        name: listed_intro
        widget: "object"
        fields:
          - { label: "Order in group", name: order, widget: number }
          - { label: "Image", name: image, widget: image, class: "thumb" }
          - { label: "Description", name: description, widget: string, required: false }

      - { label: "Heading", name: h1, widget: string }
      - label: Intro images
        name: intro_images
        widget: list
        fields:
        - { label: "Title", name: title, widget: string, required: false }
        - { label: "Tag", name: tag, widget: string, required: false }
        - { label: "Class", name: class, widget: select, options: ["gold", "dark", "gray"] }
        - { label: "Image", name: image, widget: image, class: "thumb" }
      - { label: "Intro", name: intro, widget: markdown, required: false }
      - { label: "Sections title", name: sections_title, widget: string, required: false }
      - label: Sections
        name: sections
        widget: list
        fields:
          - { label: "Title", name: title, widget: string, required: false }
          - { label: "Class", name: class, widget: string, required: false }
          - { label: "Text", name: content, widget: markdown, required: false }
          - label: Section images
            name: images
            widget: list
            required: false
            fields:
            - { label: "Title", name: title, widget: string }
            - { label: "Tag", name: tag, widget: string, required: false }
            - { label: "Class", name: class, widget: select, options: ["gold", "dark", "gray"] }
            - { label: "Image", name: image, widget: image, class: "thumb" }
  
  - name: news # Used in routes, ie.: /admin/collections/:slug/edit
    label: "News" # Used in the UI
    label_singular: "News" # Used in the UI, ie: "New Post"
    description: >
      News pages
    folder: "content/news"
    slug: "{{slug}}"
    create: true # Allow users to create new documents in this collection
    sortable_fields: ['title', 'date', 'listed_intro.order']
    view_filters:
      - label: Posts With Index
        field: title
        pattern: "This is post #"
      - label: Posts Without Index
        field: title
        pattern: front matter post
      - label: Drafts
        field: draft
        pattern: true

    fields: # The fields each document in this collection have
      - { label: "Title", name: "title", widget: "string", tagname: "h1" }
      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
          format: "YYYY-MM-DD HH:mm",
        }
      - { label: "Type", name: "type", widget: "hidden", default: "procedures" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - {
        label: Meta,
        name: meta,
        widget: "object",
        fields: [
          { label: "Title", name: title, widget: string, },
          { label: "Keywords", name: keywords, widget: string, required: false },
          { label: "Description", name: description, widget: string, required: false },
          { label: "Headline", name: headline, widget: string, required: false }
          ]
        }
        
      - label: List view
        name: listed_intro
        widget: "object"
        fields:
          - { label: "Order in group", name: order, widget: number }
          - { label: "Image", name: image, widget: image, class: "thumb" }
          - { label: "Description", name: description, widget: string, required: false }

      - { label: "Heading", name: h1, widget: string }
      - label: Intro images
        name: intro_images
        widget: list
        fields:
        - { label: "Title", name: title, widget: string }
        - { label: "Tag", name: tag, widget: string, required: false }
        - { label: "Class", name: class, widget: select, options: ["gold", "dark", "gray"] }
        - { label: "Image", name: image, widget: image, class: "thumb" }
      - { label: "Intro", name: intro, widget: markdown, required: false }
      - { label: "Sections title", name: sections_title, widget: string, required: false }
      - label: Sections
        name: sections
        widget: list
        fields:
          - { label: "Title", name: title, widget: string }
          - { label: "Class", name: class, widget: string, required: false }
          - { label: "Text", name: content, widget: markdown, required: false }
          - label: Section images
            name: images
            widget: list
            required: false
            fields:
            - { label: "Title", name: title, widget: string }
            - { label: "Tag", name: tag, widget: string, required: false }
            - { label: "Class", name: class, widget: select, options: ["gold", "dark", "gray"] }
            - { label: "Image", name: image, widget: image, class: "thumb" }
  

  - name: "rest"
    label: "Main pages"
    delete: false # Prevent users from deleting documents in this collection
    editor:
      preview: false
    files:
      - name: "home"
        label: "Home"
        file: "content/_index.md"
        description: "Home page"
        fields:
          - label: Meta
            name: meta
            widget: "object"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Keywords", name: keywords, widget: string, required: false }
              - { label: "Description", name: description, widget: string, required: false }
              - { label: "Headline", name: headline, widget: string, required: false }
          - { label: "Heading", name: "h1", widget: "string" }

          - label: About us
            name: about_us
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: content, widget: markdown, required: false }
              - { label: "Intro", name: intro, widget: markdown, required: false }
              - { label: "Contact us", name: contact, widget: markdown, required: false }
              - label: Boxes
                name: boxes
                widget: object
                required: true
                fields:
                - label: Left box
                  name: left
                  widget: object
                  required: true
                  fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Logo", name: logo, widget: image, required: false }
                - label: Middle box
                  name: middle
                  widget: object
                  required: true
                  fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Logo", name: logo, widget: image, required: false }
                - label: Right box
                  name: right
                  widget: object
                  required: true
                  fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Logo", name: logo, widget: image, required: false }
              - label: Big Image
                name: big_image
                widget: object
                fields:
                  - { label: "Image", name: img, widget: image }
                  - { label: "Image class", name: cls, widget: string }
                  - { label: "Image xxlarge", name: image_xxl, widget: image, required: false }
                  - { label: "Image xlarge", name: image_xl, widget: image, required: false }
                  - { label: "Image large", name: image_l, widget: image, required: false }
                  - { label: "Image medium", name: image_m, widget: image, required: false }
                  - { label: "Image small", name: image_s, widget: image, required: false }
                  - { label: "Image x-small", name: image_xs, widget: image, required: false }
                  - { label: "Image micro", name: image_micro, widget: image, required: false }

          - label: Portfolio
            name: portfolio
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: content, widget: markdown, required: false }
              - label: Groups
                name: groups
                widget: list
                required: true
                fields:
                - { label: "Title", name: title, widget: string }
                - { label: "Group", name: group, widget: string }
              - label: Projects
                name: projects
                widget: list
                required: true
                fields:
                - { label: "Title", name: title, widget: string }
                - { label: "Tags", name: tags, widget: string, required: false }
                - { label: "Text", name: content, widget: markdown, required: false }
                - label: Project image
                  name: img
                  widget: object
                  fields:
                    - { label: "Image link", name: src, widget: image }
                    - { label: "Alt", name: alt, widget: string, required: false }

          - label: Services
            name: services
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: content, widget: markdown, required: false }
              - { label: "Contact us", name: contact, widget: markdown, required: false}
              - label: List of services
                name: list
                widget: list
                required: true
                fields:
                - { label: "Title", name: title, widget: string }
                - { label: "Box class", name: cls, widget: string }
                - { label: "Size", name: size, widget: select, options: ["big", "small"] }
                - { label: "Image", name: logo, widget: image, required: false }
                - { label: "Intro", name: intro, widget: string, required: false }
                - { label: "Text", name: content, widget: markdown, required: false }

          - label: Clients
            name: clients
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: content, widget: markdown, required: false }
              - label: List of clients
                name: list
                widget: list
                required: true
                fields:
                - { label: "Title", name: title, widget: string }
                - { label: "Logo", name: logo, widget: image }

          - label: Certifications
            name: certifications
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: content, widget: markdown, required: false }
              - label: List of certificates
                name: list
                widget: list
                required: true
                fields:
                - { label: "Title", name: title, widget: string }
                - { label: "Logo", name: logo, widget: image }

          - label: Our team
            name: team
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Subtitle", name: subtitle, widget: string }
              - { label: "Intro", name: intro, widget: string }
              - { label: "Text", name: content, widget: markdown, required: false }
              - label: List of team members
                name: list
                widget: list
                required: true
                fields:
                - { label: "Name", name: name, widget: string }
                - { label: "Title", name: title, widget: string }
                - { label: "Position", name: position, widget: string }
                - { label: "Size", name: size, widget: select, options: ["big", "small"] }
                - { label: "Image", name: img, widget: image }
                - { label: "Text", name: content, widget: markdown, required: false }
          - label: Bottom form contact
            name: contact
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: content, widget: markdown, required: false }

