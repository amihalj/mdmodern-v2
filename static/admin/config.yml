              - { label: "form_email", name: form_email, widget: string }
              - { label: "form_subject", name: form_subject, widget: string }
              - { label: "form_message", name: form_message, widget: string }
              - { label: "form_submit", name: form_submit, widget: string }
              - { label: "form_success", name: form_success, widget: string }
              - { label: "form_error", name: form_error, widget: string }

